<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — CAMPUS OS</title>
  <meta name="description" content="Campus OS: Student Academic Workspace. Sign in to access your semester dashboard, syllabus, labs, and attendance.">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 20%, rgba(30, 58, 138, 0.18) 0%, transparent 65%), var(--bg-app);
      position: relative;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2.2rem;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #1E3A8A 0%, var(--brand-blue) 50%, #60A5FA 100%);
    }

    .login-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .login-brand-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, #1E3A8A 0%, var(--brand-blue) 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 0 20px var(--brand-blue-glow);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .login-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .login-tagline {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--brand-blue);
      margin-top: 0.35rem;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle-btn:hover {
      color: var(--text-primary);
    }

    .demo-credentials-card {
      background-color: var(--bg-surface);
      border: 1px dashed var(--border-default);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.82rem;
    }

    .demo-credentials-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .demo-cred-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-secondary);
      padding: 0.15rem 0;
    }

    .demo-cred-val {
      font-weight: 600;
      color: var(--text-primary);
      background-color: var(--bg-surface-elevated);
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
    }

    .error-alert {
      display: none;
      background-color: var(--color-danger-bg);
      border: 1px solid var(--color-danger-border);
      color: var(--color-danger);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .theme-corner-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
    }
  </style>
</head>
<body>

  <button type="button" class="topbar-action-btn theme-corner-btn" data-theme-toggle title="Toggle Theme" aria-label="Toggle theme">
    <span class="theme-toggle-icon">
      <svg viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
    </span>
  </button>

  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <h1 class="login-title">CAMPUS OS</h1>
        <div class="login-tagline">KNOW YOUR SEMESTER.</div>
        <p class="login-subtitle">The Student Academic Workspace • Portal Login</p>
      </div>

      <!-- Demo Credentials Helper Card -->
      <div class="demo-credentials-card">
        <div class="demo-credentials-header">
          <span style="font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; color: var(--brand-blue); font-weight: 700;">Demo Credentials</span>
          <button type="button" class="btn btn-sm btn-outline" id="auto-fill-btn" style="padding: 0.2rem 0.5rem; font-size: 0.72rem;">
            Auto-Fill
          </button>
        </div>
        <div class="demo-cred-row">
          <span>Registration ID:</span>
          <code class="demo-cred-val">DEMO2025</code>
        </div>
        <div class="demo-cred-row">
          <span>Password:</span>
          <code class="demo-cred-val">Student@123</code>
        </div>
      </div>

      <!-- Error Message Box -->
      <div class="error-alert" id="login-error-box" role="alert" aria-live="assertive"></div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="reg-id" class="form-label">Registration ID</label>
          <input 
            type="text" 
            id="reg-id" 
            name="regId" 
            class="input-field" 
            placeholder="e.g. DEMO2025" 
            autocomplete="username"
            required
            aria-required="true"
          >
          <span class="field-error-msg" id="reg-id-error" style="color: var(--color-danger); font-size: 0.76rem; display: none;"></span>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label for="password" class="form-label">Password</label>
            <span style="font-size: 0.75rem; color: var(--text-muted); cursor: pointer;" id="forgot-pass-hint">Demo only</span>
          </div>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="input-field" 
              placeholder="••••••••••••" 
              autocomplete="current-password"
              required
              aria-required="true"
            >
            <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="Show password" title="Toggle password visibility">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="field-error-msg" id="password-error" style="color: var(--color-danger); font-size: 0.76rem; display: none;"></span>
        </div>

        <div style="margin-top: 1.6rem;">
          <button type="submit" class="btn btn-primary btn-lg" id="submit-login-btn" style="width: 100%;">
            <span id="btn-text">Sign In to Campus OS</span>
            <svg id="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </form>

      <div style="margin-top: 1.8rem; text-align: center; border-top: 1px solid var(--border-hairline); padding-top: 1.25rem;">
        <span style="font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-mono);">
          Educational Prototype • Local State Only
        </span>
      </div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script>
    // Redirect if already logged in
    CampusAuth.redirectIfLoggedIn();

    const form = document.getElementById("login-form");
    const regInput = document.getElementById("reg-id");
    const passInput = document.getElementById("password");
    const errorBox = document.getElementById("login-error-box");
    const regError = document.getElementById("reg-id-error");
    const passError = document.getElementById("password-error");
    const submitBtn = document.getElementById("submit-login-btn");
    const btnText = document.getElementById("btn-text");
    const autoFillBtn = document.getElementById("auto-fill-btn");
    const togglePassBtn = document.getElementById("toggle-password-btn");

    // Check if redirected after logout
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("logged_out") === "true") {
      CampusUtils.showToast("Signed out successfully. Have a productive study session!", "info");
    }

    // Auto-fill demo credentials
    autoFillBtn.addEventListener("click", () => {
      regInput.value = CampusAuth.DEMO_USER;
      passInput.value = CampusAuth.DEMO_PASS;
      clearErrors();
      CampusUtils.showToast("Demo credentials filled: DEMO2025 / Student@123", "info");
    });

    // Password visibility toggle
    let isPassVisible = false;
    togglePassBtn.addEventListener("click", () => {
      isPassVisible = !isPassVisible;
      passInput.type = isPassVisible ? "text" : "password";
      togglePassBtn.innerHTML = isPassVisible
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    });

    function clearErrors() {
      errorBox.style.display = "none";
      errorBox.textContent = "";
      regError.style.display = "none";
      passError.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const regVal = regInput.value.trim();
      const passVal = passInput.value.trim();

      let hasLocalError = false;
      if (!regVal) {
        regError.textContent = "Registration ID is required.";
        regError.style.display = "block";
        hasLocalError = true;
      }
      if (!passVal) {
        passError.textContent = "Password is required.";
        passError.style.display = "block";
        hasLocalError = true;
      }
      if (hasLocalError) return;

      // Loading state
      submitBtn.disabled = true;
      btnText.textContent = "Authenticating Academic Credentials...";

      try {
        await CampusAuth.login(regVal, passVal);
        btnText.textContent = "Access Granted! Loading Workspace...";
        CampusUtils.showToast("Authentication successful! Welcome Sahil Singh.", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 350);
      } catch (err) {
        submitBtn.disabled = false;
        btnText.textContent = "Sign In to Campus OS";
        errorBox.textContent = err.message || "Invalid credentials.";
        errorBox.style.display = "block";
        CampusUtils.showToast(err.message, "error");
      }
    });

    document.getElementById("forgot-pass-hint").addEventListener("click", () => {
      CampusUtils.showToast("For this local demo, please use: Student@123", "info");
    });
  </script>
</body>
</html>
